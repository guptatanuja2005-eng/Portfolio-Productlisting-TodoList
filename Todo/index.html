<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="A responsive To-Do List application with Local Storage">

    <title>TaskFlow | To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">
            Task<span>Flow</span>
        </div>

        <div class="header-text">
            Stay organized. Get things done.
        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="container">

        <!-- TITLE -->

        <section class="hero">

            <div>
                <p class="small-title">
                    MY TASKS
                </p>

                <h1>
                    Organize your
                    <span>day.</span>
                </h1>

                <p class="subtitle">
                    Add tasks, track your progress and
                    keep everything saved automatically.
                </p>
            </div>

        </section>


        <!-- ================= TODO CARD ================= -->

        <section class="todo-card">

            <!-- ADD TASK -->

            <div class="input-section">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    autocomplete="off">

                <button
                    id="addTaskBtn"
                    type="button">

                    Add Task

                </button>

            </div>


            <!-- FILTERS -->

            <div class="toolbar">

                <div class="filters">

                    <button
                        class="filter-btn active"
                        data-filter="all">

                        All

                    </button>

                    <button
                        class="filter-btn"
                        data-filter="pending">

                        Pending

                    </button>

                    <button
                        class="filter-btn"
                        data-filter="completed">

                        Completed

                    </button>

                </div>


                <button
                    id="clearCompleted"
                    class="clear-btn">

                    Clear Completed

                </button>

            </div>


            <!-- TASK LIST -->

            <div id="taskList" class="task-list">

                <!-- JavaScript will insert tasks here -->

            </div>


            <!-- EMPTY MESSAGE -->

            <div
                id="emptyMessage"
                class="empty-message">

                <div class="empty-icon">
                    ✓
                </div>

                <h3>
                    No tasks yet
                </h3>

                <p>
                    Add your first task above to get started.
                </p>

            </div>


            <!-- FOOTER -->

            <div class="todo-footer">

                <p>
                    <strong id="taskCount">0</strong>
                    tasks remaining
                </p>

                <p class="saved-text">
                    ✓ Saved automatically
                </p>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            TaskFlow &copy; 2026
        </p>

        <p>
            Built with HTML, CSS & JavaScript
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
