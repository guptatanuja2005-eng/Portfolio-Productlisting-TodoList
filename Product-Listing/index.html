<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Product listing page with filtering and sorting">

    <title>ShopSpace | Products</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">
            Shop<span>Space</span>
        </div>

        <p>
            Find products you'll love
        </p>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="container">

        <!-- PAGE TITLE -->

        <section class="page-heading">

            <span>OUR COLLECTION</span>

            <h1>
                Explore Products
            </h1>

            <p>
                Browse our products and use the filters
                to quickly find what you're looking for.
            </p>

        </section>


        <!-- ================= FILTER PANEL ================= -->

        <section class="filter-panel">

            <div class="filter-group">

                <label for="categoryFilter">
                    Category
                </label>

                <select id="categoryFilter">

                    <option value="all">
                        All Categories
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Fashion">
                        Fashion
                    </option>

                    <option value="Home">
                        Home
                    </option>

                    <option value="Accessories">
                        Accessories
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label for="priceFilter">
                    Price
                </label>

                <select id="priceFilter">

                    <option value="all">
                        All Prices
                    </option>

                    <option value="0-1000">
                        Under ₹1,000
                    </option>

                    <option value="1000-5000">
                        ₹1,000 - ₹5,000
                    </option>

                    <option value="5000-10000">
                        ₹5,000 - ₹10,000
                    </option>

                    <option value="10000">
                        Above ₹10,000
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label for="sortFilter">
                    Sort By
                </label>

                <select id="sortFilter">

                    <option value="default">
                        Recommended
                    </option>

                    <option value="price-low">
                        Price: Low to High
                    </option>

                    <option value="price-high">
                        Price: High to Low
                    </option>

                    <option value="rating-high">
                        Rating: High to Low
                    </option>

                    <option value="name">
                        Name: A to Z
                    </option>

                </select>

            </div>


            <button
                id="resetBtn"
                class="reset-btn">

                Reset Filters

            </button>

        </section>


        <!-- ================= RESULTS ================= -->

        <div class="results-bar">

            <p>
                Showing
                <strong id="productCount">0</strong>
                products
            </p>

        </div>


        <!-- ================= PRODUCT GRID ================= -->

        <section
            id="productGrid"
            class="product-grid">

            <!-- Products generated by JavaScript -->

        </section>


        <!-- ================= EMPTY STATE ================= -->

        <section
            id="emptyState"
            class="empty-state">

            <div class="empty-icon">
                🔍
            </div>

            <h2>
                No products found
            </h2>

            <p>
                Try changing your filters.
            </p>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            ShopSpace &copy; 2026
        </p>

        <p>
            Built with HTML, CSS & JavaScript
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
