<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Contact Tanuja Gupta">

    <title>Contact | Tanuja Gupta</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <a href="index.html" class="logo">
            Tanuja<span>.</span>
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="projects.html">
                Projects
            </a>

            <a href="contact.html"
                class="active">

                Contact

            </a>

        </nav>

    </header>


    <!-- ================= CONTACT ================= -->

    <main>

        <section class="contact-container">

            <div class="contact-box">

                <h1>
                    Let's talk.
                </h1>

                <p>
                    Have a question, project idea or
                    opportunity? Send me a message.
                </p>


                <form id="contactForm">


                    <!-- NAME -->

                    <div class="form-group">

                        <label for="name">
                            Your Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <!-- MESSAGE -->

                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            placeholder="Write your message..."
                            required></textarea>

                    </div>


                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="primary-btn">

                        Send Message →

                    </button>

                </form>


                <!-- SOCIAL LINKS -->

                <div class="skills"
                    style="margin-top: 35px;">

                    <a
                        href="https://github.com/guptatanuja2005-eng"
                        target="_blank"
                        class="skill">

                        GitHub ↗

                    </a>

                    <a
                        href="https://www.linkedin.com/in/tanuja-gupta-605a4034a"
                        target="_blank"
                        class="skill">

                        LinkedIn ↗

                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Tanuja Gupta. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
